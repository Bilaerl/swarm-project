/**:    # wildcard accomodates namespaced node names (e.g., /rover1/ekf_filter_node)
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    two_d_mode: true
    publish_tf: true

    map_frame: map              
    odom_frame: odom            
    base_link_frame: base_link  
    world_frame: odom           

    # Wheel Odometry (from Gazebo DiffDrive plugin)
    odom0: odom
    odom0_config: [false,  false,  false, # X, Y, Z
                   false, false, false,  # Roll, Pitch, Yaw
                   true,  true, false, # VX, VY, VZ
                   false, false, false,  # Vroll, Vpitch, Vyaw
                   false, false, false] # Ax, Ay, Az
    odom0_differential: false
    odom0_queue_size: 10

    # IMU Data (from IMU sensor in Gazebo)
    imu0: imu
    imu0_config: [false, false, false, # X, Y, Z
                  true, true, true,  # Roll, Pitch, Yaw (Trust Yaw)
                  false, false, false, # VX, VY, VZ
                  true, true, true,  # Vroll, Vpitch, Vyaw (Trust Vyaw)
                  false, false, false] # Ax, Ay, Az
    imu0_differential: false
    imu0_queue_size: 10
